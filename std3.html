એક દિવસ સસલાએ કાચબાને કહ્યું, "અરે ધીમા કાચબા, તું ક્યારેય મારી સામે જીતી ન શકે!"

હરીફાઈ શરૂ થઈ. સસલું ઝડપથી આગળ નીકળી ગયું. અડધે રસ્તે તે થાકીને સૂઈ ગયું. કાચબો ધીમે ધીમે પણ સતત ચાલતો રહ્યો અને જીતી ગયો!
