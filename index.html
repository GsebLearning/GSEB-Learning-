<!DOCTYPE html>
<html lang="gu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ધોરણ 6 ગણિત - ઇન્ટરેક્ટિવ શિક્ષણ</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: rgba(255,255,255,0.95);
            border-radius: 25px;
            padding: 25px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15);
            backdrop-filter: blur(10px);
        }

        h1 {
            text-align: center;
            color: #2c3e50;
            font-size: 28px;
            margin-bottom: 5px;
            border-bottom: 4px solid #3498db;
            padding-bottom: 15px;
        }

        .subtitle {
            text-align: center;
            color: #7f8c8d;
            font-size: 16px;
            margin-bottom: 25px;
        }

        /* Chapter Selector */
        .chapter-selector {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin-bottom: 25px;
        }

        .chapter-btn {
            padding: 10px 18px;
            border: 2px solid #3498db;
            border-radius: 30px;
            background: white;
            color: #2c3e50;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 14px;
        }

        .chapter-btn:hover {
            background: #3498db;
            color: white;
            transform: scale(1.05);
        }

        .chapter-btn.active {
            background: #3498db;
            color: white;
            box-shadow: 0 4px 15px rgba(52,152,219,0.4);
        }

        /* Question Area */
        .question-area {
            background: #f8f9fa;
            border-radius: 18px;
            padding: 25px;
            min-height: 400px;
            border: 2px dashed #bdc3c7;
            transition: all 0.3s;
        }

        .question-title {
            font-size: 20px;
            color: #2c3e50;
            margin-bottom: 15px;
            padding: 10px;
            background: white;
            border-radius: 12px;
            border-left: 5px solid #3498db;
        }

        .question-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin: 15px 0;
        }

        @media (max-width: 600px) {
            .question-grid {
                grid-template-columns: 1fr;
            }
        }

        /* Drag Items */
        .drag-items {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            padding: 15px;
            background: #eaf2f8;
            border-radius: 15px;
            min-height: 80px;
            border: 2px solid #aed6f1;
            margin: 10px 0;
        }

        .drag-item {
            padding: 12px 22px;
            background: linear-gradient(135deg, #3498db, #2980b9);
            color: white;
            border-radius: 30px;
            cursor: grab;
            font-weight: bold;
            font-size: 16px;
            user-select: none;
            transition: all 0.2s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }

        .drag-item:active {
            cursor: grabbing;
            transform: scale(0.95);
        }

        .drag-item:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(52,152,219,0.4);
        }

        .drag-item.dragging {
            opacity: 0.5;
        }

        /* Drop Zones */
        .drop-zone {
            padding: 12px 18px;
            background: white;
            border: 3px dashed #3498db;
            border-radius: 12px;
            min-height: 55px;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            transition: all 0.3s;
            font-size: 15px;
        }

        .drop-zone.drag-over {
            border-color: #e74c3c;
            background: #fdebd0;
            transform: scale(1.02);
        }

        .drop-zone.filled {
            border-color: #2ecc71;
            background: #d5f5e3;
        }

        .drop-zone .placed-item {
            padding: 6px 16px;
            background: #2ecc71;
            color: white;
            border-radius: 20px;
            font-weight: bold;
            font-size: 14px;
            animation: popIn 0.3s ease;
        }

        @keyframes popIn {
            0% { transform: scale(0); }
            100% { transform: scale(1); }
        }

        .drop-label {
            color: #7f8c8d;
            font-size: 14px;
            font-weight: 500;
        }

        /* Match Pairs */
        .match-pair {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 10px;
            background: white;
            border-radius: 10px;
            margin: 8px 0;
            border: 1px solid #ecf0f1;
        }

        .match-left {
            flex: 1;
            font-weight: 600;
            color: #2c3e50;
        }

        .match-right {
            flex: 1;
            min-height: 50px;
            border: 2px dashed #bdc3c7;
            border-radius: 10px;
            padding: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            transition: all 0.3s;
            background: #fafafa;
        }

        .match-right.drag-over {
            border-color: #e74c3c;
            background: #fdebd0;
        }

        .match-right.filled {
            border-color: #2ecc71;
            background: #d5f5e3;
        }

        /* Buttons */
        .action-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
            margin-top: 20px;
        }

        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 30px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #3498db, #2980b9);
            color: white;
            box-shadow: 0 4px 15px rgba(52,152,219,0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(52,152,219,0.5);
        }

        .btn-success {
            background: linear-gradient(135deg, #2ecc71, #27ae60);
            color: white;
            box-shadow: 0 4px 15px rgba(46,204,113,0.3);
        }

        .btn-success:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(46,204,113,0.5);
        }

        .btn-danger {
            background: linear-gradient(135deg, #e74c3c, #c0392b);
            color: white;
            box-shadow: 0 4px 15px rgba(231,76,60,0.3);
        }

        .btn-danger:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(231,76,60,0.5);
        }

        .btn-warning {
            background: linear-gradient(135deg, #f39c12, #e67e22);
            color: white;
            box-shadow: 0 4px 15px rgba(243,156,18,0.3);
        }

        .btn-warning:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(243,156,18,0.5);
        }

        /* Score */
        .score-box {
            text-align: center;
            padding: 15px;
            background: linear-gradient(135deg, #2c3e50, #34495e);
            border-radius: 15px;
            color: white;
            margin-top: 15px;
        }

        .score-box span {
            font-size: 28px;
            font-weight: bold;
            color: #f1c40f;
        }

        /* Feedback */
        .feedback {
            padding: 15px;
            border-radius: 12px;
            margin-top: 15px;
            font-weight: 500;
            text-align: center;
            display: none;
        }

        .feedback.correct {
            display: block;
            background: #d5f5e3;
            color: #27ae60;
            border: 2px solid #2ecc71;
        }

        .feedback.wrong {
            display: block;
            background: #fdebd0;
            color: #c0392b;
            border: 2px solid #e74c3c;
        }

        /* Simulation Step */
        .simulation-step {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            background: white;
            border-radius: 15px;
            margin: 10px 0;
            border: 2px solid #ecf0f1;
        }

        .step-number {
            width: 40px;
            height: 40px;
            background: #3498db;
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .step-content {
            text-align: center;
            font-size: 18px;
            color: #2c3e50;
            padding: 10px;
        }

        .step-arrow {
            font-size: 30px;
            color: #3498db;
            margin: 5px 0;
        }

        /* Reset */
        .reset-btn {
            margin-top: 10px;
        }

        /* Responsive */
        @media (max-width: 480px) {
            .container {
                padding: 12px;
            }
            h1 {
                font-size: 20px;
            }
            .chapter-btn {
                padding: 6px 12px;
                font-size: 12px;
            }
            .drag-item {
                padding: 8px 14px;
                font-size: 13px;
            }
        }

        /* Smooth animations */
        .fade-in {
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .congrats {
            font-size: 22px;
            color: #2ecc71;
            text-align: center;
            padding: 20px;
            animation: bounce 0.5s ease;
        }

        @keyframes bounce {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>📐 ધોરણ 6 ગણિત - ઇન્ટરેક્ટિવ શિક્ષણ</h1>
    <p class="subtitle">🖱️ ડ્રેગ કરો, ખાલી જગ્યા ભરો, જોડકાં જોડો અને શીખો!</p>

    <!-- Chapter Selector -->
    <div class="chapter-selector" id="chapterSelector">
        <button class="chapter-btn active" data-chapter="1">પ્રકરણ 1</button>
        <button class="chapter-btn" data-chapter="2">પ્રકરણ 2</button>
        <button class="chapter-btn" data-chapter="3">પ્રકરણ 3</button>
        <button class="chapter-btn" data-chapter="4">પ્રકરણ 4</button>
        <button class="chapter-btn" data-chapter="5">પ્રકરણ 5</button>
        <button class="chapter-btn" data-chapter="6">પ્રકરણ 6</button>
        <button class="chapter-btn" data-chapter="7">પ્રકરણ 7</button>
        <button class="chapter-btn" data-chapter="8">પ્રકરણ 8</button>
        <button class="chapter-btn" data-chapter="9">પ્રકરણ 9</button>
        <button class="chapter-btn" data-chapter="10">પ્રકરણ 10</button>
    </div>

    <!-- Question Area -->
    <div class="question-area" id="questionArea">
        <div id="content"></div>
    </div>

    <!-- Score -->
    <div class="score-box">
        ⭐ સ્કોર: <span id="scoreDisplay">0</span> / <span id="totalQuestions">0</span>
    </div>

    <!-- Feedback -->
    <div class="feedback" id="feedback"></div>

    <!-- Action Buttons -->
    <div class="action-buttons">
        <button class="btn btn-success" onclick="checkAnswers()">✅ જવાબ ચકાસો</button>
        <button class="btn btn-warning" onclick="resetChapter()">🔄 ફરીથી કરો</button>
        <button class="btn btn-primary" onclick="showNextStep()">⏭️ આગળનું પગલું</button>
        <button class="btn btn-danger" onclick="resetAll()">🔁 બધું રીસેટ</button>
    </div>
</div>

<script>
    // ===== DATA =====
    const chapters = {
        1: {

                { type: "drag", question: "1, 4, 9, 16, 25... આ સંખ્યાઓને ________ કહેવાય.", options: ["ત્રિકોણ", "વર્ગ", "ઘન", "બેકી", "એકી"], answer: ["વર્ગ"], dropLabels: ["______"] },

        },
        10: {
            name: "શૂન્યની બીજી બાજુ",
            questions: [
                { type: "drag", question: "-5 + 3 = ?", options: ["-8", "-2", "2", "8", "0"], answer: ["-2"], dropLabels: ["______"] },
                { type: "drag", question: "7 - 10 = ?", options: ["3", "-3", "17", "-17", "0"], answer: ["-3"], dropLabels: ["______"] },
                { type: "match", question: "જોડકાં જોડો:", pairs: [["-3", "ઋણ"], ["5", "ધન"], ["0", "તટસ્થ"]], left: ["-3", "5", "0"], right: ["ઋણ", "ધન", "તટસ્થ"] }
            ]
        }
    };

    // ===== STATE =====
    let currentChapter = 1;
    let score = 0;
    let totalQ = 0;
    let stepIndex = 0;
    let placedItems = {};
    let matchPairs = {};

    // ===== RENDER =====
    function renderChapter(chapterNum) {
        currentChapter = chapterNum;
        const data = chapters[chapterNum];
        if (!data) return;

        const container = document.getElementById('content');
        container.innerHTML = `<div class="question-title">📖 ${data.name}</div>`;

        let html = '';
        let qIndex = 0;

        data.questions.forEach((q, idx) => {
            if (q.type === 'drag') {
                html += renderDragQuestion(q, idx);
                totalQ += q.answer.length;
            } else if (q.type === 'match') {
                html += renderMatchQuestion(q, idx);
                totalQ += q.pairs.length;
            }
        });

        container.innerHTML += html;
        document.getElementById('totalQuestions').textContent = totalQ;
        updateScore();
        resetFeedback();
        attachDragEvents();
        attachMatchEvents();
    }

    function renderDragQuestion(q, idx) {
        const qId = `q${idx}`;
        let html = `<div class="fade-in" style="margin-bottom:20px;background:white;padding:15px;border-radius:12px;border:1px solid #ecf0f1;">`;
        html += `<p style="font-weight:600;color:#2c3e50;font-size:16px;">${q.question}</p>`;

        // Drop Zones
        html += `<div class="drag-items" id="dragItems_${qId}">`;
        q.dropLabels.forEach((label, i) => {
            const dropId = `${qId}_drop_${i}`;
            html += `<div class="drop-zone" id="${dropId}" data-q="${qId}" data-index="${i}">`;
            html += `<span class="drop-label">${label}</span>`;
            html += `<div class="placed-item" style="display:none;"></div>`;
            html += `</div>`;
        });
        html += `</div>`;

        // Options (draggable)
        html += `<div class="drag-items" style="background:#fef9e7;border-color:#f1c40f;">`;
        html += `<span style="color:#7f8c8d;font-size:13px;width:100%;">⬇️ નીચેના વિકલ્પોમાંથી ખેંચીને મૂકો:</span>`;
        q.options.forEach((opt, oi) => {
            const optId = `${qId}_opt_${oi}`;
            html += `<div class="drag-item" id="${optId}" draggable="true" data-value="${opt}" data-q="${qId}">${opt}</div>`;
        });
        html += `</div>`;

        html += `</div>`;
        return html;
    }

    function renderMatchQuestion(q, idx) {
        const qId = `m${idx}`;
        let html = `<div class="fade-in" style="margin-bottom:20px;background:white;padding:15px;border-radius:12px;border:1px solid #ecf0f1;">`;
        html += `<p style="font-weight:600;color:#2c3e50;font-size:16px;">${q.question}</p>`;

        q.left.forEach((leftItem, i) => {
            const pairId = `${qId}_pair_${i}`;
            html += `<div class="match-pair" id="${pairId}">`;
            html += `<div class="match-left">${leftItem}</div>`;
            html += `<div class="match-right" id="${pairId}_drop" data-q="${qId}" data-index="${i}">`;
            html += `<span style="color:#bdc3c7;font-size:13px;">➡️ અહીં યોગ્ય વિકલ્પ મૂકો</span>`;
            html += `<div class="placed-item" style="display:none;"></div>`;
            html += `</div>`;
            html += `</div>`;
        });

        // Options
        html += `<div class="drag-items" style="background:#eaf2f8;border-color:#85c1e9;margin-top:10px;">`;
        html += `<span style="color:#7f8c8d;font-size:13px;width:100%;">⬇️ જમણી બાજુના વિકલ્પો:</span>`;
        q.right.forEach((opt, oi) => {
            const optId = `${qId}_mopt_${oi}`;
            html += `<div class="drag-item" id="${optId}" draggable="true" data-value="${opt}" data-q="${qId}">${opt}</div>`;
        });
        html += `</div>`;

        html += `</div>`;
        return html;
    }

    // ===== DRAG & DROP EVENTS =====
    function attachDragEvents() {
        const dragItems = document.querySelectorAll('.drag-item');
        const dropZones = document.querySelectorAll('.drop-zone');

        dragItems.forEach(item => {
            item.addEventListener('dragstart', handleDragStart);
            item.addEventListener('dragend', handleDragEnd);
        });

        dropZones.forEach(zone => {
            zone.addEventListener('dragover', handleDragOver);
            zone.addEventListener('dragenter', handleDragEnter);
            zone.addEventListener('dragleave', handleDragLeave);
            zone.addEventListener('drop', handleDrop);
        });

        // Match drop zones
        document.querySelectorAll('.match-right').forEach(zone => {
            zone.addEventListener('dragover', handleDragOver);
            zone.addEventListener('dragenter', handleDragEnter);
            zone.addEventListener('dragleave', handleDragLeave);
            zone.addEventListener('drop', handleMatchDrop);
        });
    }

    function attachMatchEvents() {
        // Already attached via above
    }

    let draggedItem = null;

    function handleDragStart(e) {
        draggedItem = this;
        this.classList.add('dragging');
        e.dataTransfer.effectAllowed = 'move';
        e.dataTransfer.setData('text/plain', this.id);
    }

    function handleDragEnd(e) {
        this.classList.remove('dragging');
        document.querySelectorAll('.drop-zone, .match-right').forEach(z => z.classList.remove('drag-over'));
    }

    function handleDragOver(e) {
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';
    }

    function handleDragEnter(e) {
        e.preventDefault();
        this.classList.add('drag-over');
    }

    function handleDragLeave(e) {
        this.classList.remove('drag-over');
    }

    function handleDrop(e) {
        e.preventDefault();
        this.classList.remove('drag-over');

        const dragId = e.dataTransfer.getData('text/plain');
        const dragEl = document.getElementById(dragId);
        if (!dragEl) return;

        const value = dragEl.dataset.value;
        const qId = dragEl.dataset.q;

        // Check if this drop zone already has a placed item
        const existing = this.querySelector('.placed-item');
        if (existing && existing.style.display !== 'none') {
            // Remove old placed item if any
            const oldVal = existing.textContent;
            // Return the old item to options
            const oldOpt = document.querySelector(`.drag-item[data-value="${oldVal}"][data-q="${qId}"]`);
            if (oldOpt) oldOpt.style.display = 'inline-block';
            existing.style.display = 'none';
        }

        // Place the new item
        const placed = this.querySelector('.placed-item');
        if (placed) {
            placed.textContent = value;
            placed.style.display = 'inline-block';
            this.classList.add('filled');
            dragEl.style.display = 'none';

            // Store placement
            const dropId = this.id;
            if (!placedItems[qId]) placedItems[qId] = {};
            placedItems[qId][dropId] = value;
        }
    }

    function handleMatchDrop(e) {
        e.preventDefault();
        this.classList.remove('drag-over');

        const dragId = e.dataTransfer.getData('text/plain');
        const dragEl = document.getElementById(dragId);
        if (!dragEl) return;

        const value = dragEl.dataset.value;
        const qId = dragEl.dataset.q;
        const index = this.dataset.index;

        // Check if already filled
        const existing = this.querySelector('.placed-item');
        if (existing && existing.style.display !== 'none') {
            const oldVal = existing.textContent;
            const oldOpt = document.querySelector(`.drag-item[data-value="${oldVal}"][data-q="${qId}"]`);
            if (oldOpt) oldOpt.style.display = 'inline-block';
            existing.style.display = 'none';
        }

        const placed = this.querySelector('.placed-item');
        if (placed) {
            placed.textContent = value;
            placed.style.display = 'inline-block';
            this.classList.add('filled');
            dragEl.style.display = 'none';

            const pairId = this.id;
            if (!matchPairs[qId]) matchPairs[qId] = {};
            matchPairs[qId][pairId] = value;
        }
    }

    // ===== CHECK ANSWERS =====
    function checkAnswers() {
        const data = chapters[currentChapter];
        let correct = 0;
        let total = 0;

        data.questions.forEach((q, idx) => {
            if (q.type === 'drag') {
                const qId = `q${idx}`;
                const drops = document.querySelectorAll(`.drop-zone[data-q="${qId}"]`);
                drops.forEach((drop, i) => {
                    total++;
                    const placed = drop.querySelector('.placed-item');
                    if (placed && placed.style.display !== 'none') {
                        const val = placed.textContent;
                        if (q.answer[i] === val) {
                            correct++;
                            drop.style.borderColor = '#2ecc71';
                            drop.style.background = '#d5f5e3';
                        } else {
                            drop.style.borderColor = '#e74c3c';
                            drop.style.background = '#fdebd0';
                        }
                    } else {
                        drop.style.borderColor = '#e74c3c';
                        drop.style.background = '#fdebd0';
                    }
                });
            } else if (q.type === 'match') {
                const qId = `m${idx}`;
                const pairs = document.querySelectorAll(`.match-pair`);
                pairs.forEach((pair, i) => {
                    total++;
                    const drop = pair.querySelector('.match-right');
                    const placed = drop.querySelector('.placed-item');
                    if (placed && placed.style.display !== 'none') {
                        const val = placed.textContent;
                        if (q.pairs[i] && q.pairs[i][1] === val) {
                            correct++;
                            drop.style.borderColor = '#2ecc71';
                            drop.style.background = '#d5f5e3';
                        } else {
                            drop.style.borderColor = '#e74c3c';
                            drop.style.background = '#fdebd0';
                        }
                    } else {
                        drop.style.borderColor = '#e74c3c';
                        drop.style.background = '#fdebd0';
                    }
                });
            }
        });

        score = correct;
        updateScore();

        const feedback = document.getElementById('feedback');
        if (correct === total) {
            feedback.className = 'feedback correct';
            feedback.innerHTML = `🎉 વાહ! તમે બધા જવાબ સાચા આપ્યા! 🌟 તમે ખૂબ સમજદાર છો!`;
        } else {
            feedback.className = 'feedback wrong';
            feedback.innerHTML = `😊 તમે ${correct} / ${total} સાચા કર્યા. ફરી પ્રયાસ કરો! 💪`;
        }
        feedback.style.display = 'block';
    }

    // ===== RESET =====
    function resetChapter() {
        placedItems = {};
        matchPairs = {};
        document.querySelectorAll('.drop-zone, .match-right').forEach(z => {
            z.classList.remove('filled', 'drag-over');
            z.style.borderColor = '#3498db';
            z.style.background = 'white';
            const placed = z.querySelector('.placed-item');
            if (placed) {
                placed.style.display = 'none';
                placed.textContent = '';
            }
        });
        document.querySelectorAll('.drag-item').forEach(el => {
            el.style.display = 'inline-block';
        });
        document.getElementById('feedback').style.display = 'none';
        score = 0;
        updateScore();
    }

    function resetAll() {
        resetChapter();
        stepIndex = 0;
        document.querySelectorAll('.chapter-btn').forEach(b => b.classList.remove('active'));
        document.querySelector('.chapter-btn[data-chapter="1"]').classList.add('active');
        renderChapter(1);
    }

    // ===== STEP BY STEP SIMULATION =====
    function showNextStep() {
        const data = chapters[currentChapter];
        const questions = data.questions;
        if (stepIndex >= questions.length) {
            stepIndex = 0;
        }

        const q = questions[stepIndex];
        const container = document.getElementById('content');

        // Show step info
        const stepDiv = document.createElement('div');
        stepDiv.className = 'simulation-step fade-in';
        stepDiv.innerHTML = `
            <div class="step-number">${stepIndex + 1}</div>
            <div class="step-content">📌 ${q.type === 'drag' ? 'ખાલી જગ્યા ભરો' : 'જોડકાં જોડો'}: ${q.question}</div>
            <div class="step-arrow">⬇️</div>
            <button class="btn btn-primary" onclick="highlightStep(${stepIndex})">👀 આ પગલું બતાવો</button>
        `;

        // Remove old step overlay if any
        const oldStep = container.querySelector('.simulation-step');
        if (oldStep) oldStep.remove();

        container.prepend(stepDiv);
        stepIndex = (stepIndex + 1) % (questions.length + 1);
    }

    function highlightStep(idx) {
        const data = chapters[currentChapter];
        const q = data.questions[idx];
        if (!q) return;

        // Scroll to the question
        const qDiv = document.querySelector(`.question-area > div:not(.simulation-step)`);
        if (qDiv) {
            qDiv.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        // Highlight the question
        const allQ = document.querySelectorAll('.question-area .fade-in');
        allQ.forEach((el, i) => {
            if (i === idx) {
                el.style.border = '3px solid #f1c40f';
                el.style.background = '#fef9e7';
            } else {
                el.style.border = '1px solid #ecf0f1';
                el.style.background = 'white';
            }
        });
    }

    // ===== SCORE =====
    function updateScore() {
        document.getElementById('scoreDisplay').textContent = score;
    }

    function resetFeedback() {
        document.getElementById('feedback').style.display = 'none';
    }

    // ===== CHAPTER SWITCH =====
    document.querySelectorAll('.chapter-btn').forEach(btn => {
        btn.addEventListener('click', function() {
            document.querySelectorAll('.chapter-btn').forEach(b => b.classList.remove('active'));
            this.classList.add('active');
            const ch = parseInt(this.dataset.chapter);
            totalQ = 0;
            score = 0;
            stepIndex = 0;
            placedItems = {};
            matchPairs = {};
            renderChapter(ch);
        });
    });

    // ===== INIT =====
    renderChapter(1);

    // Extra helper for step simulation
    console.log("🎓 ધોરણ 6 ગણિત - ઇન્ટરેક્ટિવ શિક્ષણ શરૂ થયું! ડ્રેગ કરો, ખાલી જગ્યા ભરો, જોડકાં જોડો અને શીખો!");
</script>

</body>
</html>
